<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
      :root {
            --bg: #08090a;
            --panel: #101214;
            --panel-border: #1f2226;
            --text: #f2f2f0;
            --text-dim: #8b9096;
            --amber: #f2a93b;
            --due: #e8654e;
            --upcoming: #4fa8d8;
            --work: #7ed48c;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
            width: 100%;
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: 'Space Grotesk', sans-serif;
            overflow: hidden;
      }

      .mono { font-family: 'JetBrains Mono', monospace; }

      /* Vertical (portrait) layout:
         header / today / photos full width, then Due Soon + Upcoming side by side. */
      #app {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto auto 38vh minmax(0, 1fr);
            gap: 24px;
            width: 100vw;
            height: 100vh;
            padding: 32px;
      }

      .panel {
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 24px;
            overflow: hidden;
      }

      .label {
            text-transform: uppercase;
            letter-spacing: 0.12em;
            font-size: 0.85rem;
            color: var(--text-dim);
            font-weight: 500;
            margin-bottom: 12px;
      }

      /* ---- Header: clock + weather ---- */
      #header {
            grid-column: 1 / -1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 8px 16px 8px;
      }

      #clock-block { display: flex; flex-direction: column; }

      #clock {
            font-family: 'JetBrains Mono', monospace;
            font-size: 5.2rem;
            font-weight: 700;
            line-height: 1;
            letter-spacing: 0.02em;
      }

      #clock .ampm { font-size: 2.2rem; color: var(--text-dim); margin-left: 8px; }

      #date {
            font-size: 1.3rem;
            color: var(--text-dim);
            margin-top: 8px;
      }

      #weather {
            display: flex;
            align-items: center;
            gap: 20px;
            font-size: 1.4rem;
      }

      #weather .temp {
            font-family: 'JetBrains Mono', monospace;
            font-size: 3.2rem;
            font-weight: 700;
      }

      #weather .wx-icon { font-size: 3.4rem; }

      #weather .wx-meta {
            display: flex;
            flex-direction: column;
            color: var(--text-dim);
            font-size: 1.1rem;
      }

      #weather.error, #today-strip.error {
            color: var(--text-dim);
            font-style: italic;
      }

      /* ---- Today strip ---- */
      #today-panel {
            grid-column: 1 / -1;
            display: flex;
            flex-direction: column;
      }

      #today-strip {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            overflow-y: auto;
      }

      .chip {
            display: flex;
            flex-direction: column;
            padding: 12px 18px;
            border-radius: 12px;
            min-width: 180px;
            background: rgba(255,255,255,0.03);
            border-left: 5px solid var(--amber);
      }

      .chip.work { border-left-color: var(--work); }

      .chip .chip-title { font-weight: 600; font-size: 1.15rem; }
      .chip .chip-sub {
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-dim);
            font-size: 0.95rem;
            margin-top: 4px;
      }

      .empty-msg { color: var(--text-dim); font-style: italic; padding: 8px 0; }

      /* ---- Photo slideshow ---- */
      #photos-panel {
            grid-column: 1 / -1;
            position: relative;
            padding: 0;
            background: #000;
      }

      .slide {
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity 1.6s ease;
      }

      .slide.show { opacity: 1; }

      .slide .bg {
            position: absolute;
            inset: -40px;
            background: center/cover no-repeat;
            filter: blur(32px) brightness(0.45);
      }

      .slide img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
      }

      #photo-date {
            position: absolute;
            right: 18px;
            bottom: 14px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            color: rgba(255,255,255,0.75);
            text-shadow: 0 1px 4px rgba(0,0,0,0.8);
            z-index: 2;
      }

      #photo-msg {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 3;
      }

      /* ---- Assignments columns ---- */
      #due-col, #upcoming-col { display: flex; flex-direction: column; overflow: hidden; }
      #due-col .label { color: var(--due); }
      #upcoming-col .label { color: var(--upcoming); }

      .assign-list { display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }

      .assign-item {
            padding: 12px 16px;
            border-radius: 10px;
            background: rgba(255,255,255,0.03);
      }

      .assign-item .a-title { font-weight: 600; font-size: 1.1rem; }
      .assign-item .a-meta {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            color: var(--text-dim);
            margin-top: 3px;
      }

      #due-col .assign-item { border-left: 4px solid var(--due); }
      #upcoming-col .assign-item { border-left: 4px solid var(--upcoming); }

      .hidden { display: none !important; }

      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-thumb { background: var(--panel-border); border-radius: 3px; }
    </style>
  </head>
  <body>
    <div id="app">

        <div id="header" class="panel">
              <div id="clock-block">
                      <div id="clock" class="mono">--:--:-- <span class="ampm">--</span></div>
                      <div id="date">Loading date...</div>
              </div>
              <div id="weather">
                      <div class="wx-icon" id="wx-icon">--</div>
                      <div class="temp mono" id="wx-temp">--&deg;</div>
                      <div class="wx-meta">
                                <span id="wx-desc">Loading weather...</span>
                                <span id="wx-updated"></span>
                      </div>
              </div>
        </div>

        <div id="today-panel" class="panel">
              <div class="label">Today</div>
              <div id="today-strip"><span class="empty-msg">Loading today's schedule...</span></div>
        </div>

        <div id="photos-panel" class="panel">
              <div class="slide" id="slide-a"><div class="bg"></div><img alt=""></div>
              <div class="slide" id="slide-b"><div class="bg"></div><img alt=""></div>
              <div id="photo-date"></div>
              <div id="photo-msg"><span class="empty-msg">Loading photos...</span></div>
        </div>

        <div id="due-col" class="panel">
              <div class="label">Due Soon (48h)</div>
              <div class="assign-list" id="due-list"><span class="empty-msg">Loading assignments...</span></div>
        </div>

        <div id="upcoming-col" class="panel">
              <div class="label">Upcoming</div>
              <div class="assign-list" id="upcoming-list"><span class="empty-msg">Loading assignments...</span></div>
        </div>

    </div>

    <script>
      (function () {
          'use strict';

          // ============================================================
          // CONFIG
          // ============================================================
          const CONFIG = {
                NOTION_WORKER_URL: 'https://small-frog-34dd.joeyburtonwv.workers.dev',
                WEATHER_LAT: 39.6295,
                WEATHER_LON: -79.9559,
                WEATHER_REFRESH_MS: 15 * 60 * 1000,    // 15 min
                TODAY_REFRESH_MS: 5 * 60 * 1000,       // 5 min
                ASSIGNMENTS_REFRESH_MS: 5 * 60 * 1000, // 5 min
                ASSIGNMENTS_RERENDER_MS: 60 * 1000,    // re-sort locally every minute so past-due items drop off
                PHOTOS_REFRESH_MS: 20 * 60 * 1000,     // 20 min (iCloud URLs expire)
                PHOTO_INTERVAL_MS: 15 * 1000,          // 15 sec per photo
                DUE_SOON_HOURS: 48
          };

          const workerUrl = (path) => CONFIG.NOTION_WORKER_URL.replace(/\/$/, '') + path;
          const workerConfigured = () =>
                !!CONFIG.NOTION_WORKER_URL && !CONFIG.NOTION_WORKER_URL.includes('REPLACE_ME');

          // ============================================================
          // CLOCK
          // ============================================================
          function tickClock() {
                const now = new Date();
                let h = now.getHours();
                const m = String(now.getMinutes()).padStart(2, '0');
                const s = String(now.getSeconds()).padStart(2, '0');
                const ampm = h >= 12 ? 'PM' : 'AM';
                h = h % 12;
                if (h === 0) h = 12;
                document.getElementById('clock').innerHTML =
                        `${h}:${m}:${s} <span class="ampm">${ampm}</span>`;
                document.getElementById('date').textContent = now.toLocaleDateString(undefined, {
                        weekday: 'long', month: 'long', day: 'numeric', year: 'numeric'
                });
          }
          tickClock();
          setInterval(tickClock, 1000);

          // ============================================================
          // WEATHER (Open-Meteo, no auth)
          // ============================================================
          const WEATHER_CODES = {
                0: ['☀️', 'Clear sky'],
                1: ['🌤️', 'Mainly clear'],
                2: ['⛅', 'Partly cloudy'],
                3: ['☁️', 'Overcast'],
                45: ['🌫️', 'Fog'],
                48: ['🌫️', 'Rime fog'],
                51: ['🌦️', 'Light drizzle'],
                53: ['🌦️', 'Drizzle'],
                55: ['🌦️', 'Dense drizzle'],
                61: ['🌧️', 'Light rain'],
                63: ['🌧️', 'Rain'],
                65: ['🌧️', 'Heavy rain'],
                71: ['🌨️', 'Light snow'],
                73: ['🌨️', 'Snow'],
                75: ['🌨️', 'Heavy snow'],
                80: ['🌦️', 'Rain showers'],
                81: ['🌦️', 'Rain showers'],
                82: ['⛈️', 'Violent showers'],
                95: ['⛈️', 'Thunderstorm'],
                96: ['⛈️', 'Thunderstorm w/ hail'],
                99: ['⛈️', 'Thunderstorm w/ hail']
          };

          async function loadWeather() {
                const el = document.getElementById('weather');
                try {
                        const url = `https://api.open-meteo.com/v1/forecast?latitude=${CONFIG.WEATHER_LAT}&longitude=${CONFIG.WEATHER_LON}&current=temperature_2m,weather_code&temperature_unit=fahrenheit&timezone=auto`;
                        const res = await fetch(url);
                        if (!res.ok) throw new Error('weather http ' + res.status);
                        const data = await res.json();
                        const temp = Math.round(data.current.temperature_2m);
                        const code = data.current.weather_code;
                        const [icon, desc] = WEATHER_CODES[code] || ['🌤️', 'Weather'];
                        document.getElementById('wx-icon').textContent = icon;
                        document.getElementById('wx-temp').innerHTML = `${temp}&deg;`;
                        document.getElementById('wx-desc').textContent = desc;
                        document.getElementById('wx-updated').textContent =
                                  'Updated ' + new Date().toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
                        el.classList.remove('error');
                } catch (err) {
                        console.error('Weather load failed', err);
                        document.getElementById('wx-desc').textContent = 'Weather unavailable';
                        document.getElementById('wx-updated').textContent = '';
                        el.classList.add('error');
                }
          }
          loadWeather();
          setInterval(loadWeather, CONFIG.WEATHER_REFRESH_MS);

          // ============================================================
          // TODAY STRIP (Worker /today)
          // ============================================================
          async function loadToday() {
                const strip = document.getElementById('today-strip');
                if (!workerConfigured()) {
                        strip.innerHTML = '<span class="empty-msg">Worker URL not configured yet.</span>';
                        return;
                }
                try {
                        const res = await fetch(workerUrl('/today'));
                        if (!res.ok) throw new Error('today http ' + res.status);
                        const data = await res.json();
                        const classes = data.classes || [];
                        const work = data.work || [];
                        if (classes.length === 0 && work.length === 0) {
                                  strip.innerHTML = '<span class="empty-msg">Nothing scheduled today.</span>';
                                  return;
                        }
                        let html = '';
                        classes.forEach(c => {
                                  html += `<div class="chip">
                                      <div class="chip-title">${escapeHtml(c.name || c.courseName || 'Class')}</div>
                                      <div class="chip-sub">${escapeHtml(c.time || '')}${c.location ? ' &middot; ' + escapeHtml(c.location) : ''}</div>
                                  </div>`;
                        });
                        work.forEach(w => {
                                  html += `<div class="chip work">
                                      <div class="chip-title">${escapeHtml(w.name || w.shift || 'Shift')}</div>
                                      <div class="chip-sub">${escapeHtml(w.time || '')}${w.location ? ' &middot; ' + escapeHtml(w.location) : ''}</div>
                                  </div>`;
                        });
                        strip.innerHTML = html;
                        strip.classList.remove('error');
                } catch (err) {
                        console.error('Today load failed', err);
                        strip.innerHTML = '<span class="empty-msg">Unable to load today’s schedule.</span>';
                        strip.classList.add('error');
                }
          }
          loadToday();
          setInterval(loadToday, CONFIG.TODAY_REFRESH_MS);

          // ============================================================
          // ASSIGNMENTS (Worker /assignments)
          // ============================================================
          let assignmentItems = null;

          // Notion date-only values ("2026-10-22") would parse as UTC midnight,
          // which shows as 8 PM the previous day in Eastern time. Treat them as
          // due at the end of that local day instead.
          function parseDue(str) {
                if (!str) return null;
                const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(str);
                if (m) {
                        const d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]), 23, 59, 59);
                        return { time: d.getTime(), date: d, dateOnly: true };
                }
                const d = new Date(str);
                if (isNaN(d.getTime())) return null;
                return { time: d.getTime(), date: d, dateOnly: false };
          }

          async function loadAssignments() {
                const dueList = document.getElementById('due-list');
                const upcomingList = document.getElementById('upcoming-list');
                if (!workerConfigured()) {
                        const msg = '<span class="empty-msg">Worker URL not configured yet.</span>';
                        dueList.innerHTML = msg;
                        upcomingList.innerHTML = msg;
                        return;
                }
                try {
                        const res = await fetch(workerUrl('/assignments'));
                        if (!res.ok) throw new Error('assignments http ' + res.status);
                        const data = await res.json();
                        assignmentItems = data.items || [];
                        renderAssignments();
                } catch (err) {
                        console.error('Assignments load failed', err);
                        if (assignmentItems) { renderAssignments(); return; } // keep last good data
                        const msg = '<span class="empty-msg">Unable to load assignments.</span>';
                        dueList.innerHTML = msg;
                        upcomingList.innerHTML = msg;
                }
          }

          function renderAssignments() {
                if (!assignmentItems) return;
                const now = Date.now();
                const soonCutoff = now + CONFIG.DUE_SOON_HOURS * 60 * 60 * 1000;
                const due = [];
                const upcoming = [];

                assignmentItems.forEach(item => {
                        const parsed = parseDue(item.dueDate);
                        if (!parsed) { upcoming.push({ item, parsed: null }); return; }
                        if (parsed.time < now) return; // past due: hidden
                        if (parsed.time <= soonCutoff) due.push({ item, parsed });
                        else upcoming.push({ item, parsed });
                });

                const byTime = (a, b) => (a.parsed ? a.parsed.time : Infinity) - (b.parsed ? b.parsed.time : Infinity);
                due.sort(byTime);
                upcoming.sort(byTime);

                document.getElementById('due-list').innerHTML = due.length
                        ? due.map(renderAssignment).join('')
                        : '<span class="empty-msg">Nothing due soon.</span>';
                document.getElementById('upcoming-list').innerHTML = upcoming.length
                        ? upcoming.map(renderAssignment).join('')
                        : '<span class="empty-msg">Nothing upcoming.</span>';
          }

          function renderAssignment({ item, parsed }) {
                let dueStr = 'No due date';
                if (parsed) {
                        const opts = parsed.dateOnly
                                ? { weekday: 'short', month: 'short', day: 'numeric' }
                                : { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' };
                        dueStr = parsed.date.toLocaleString(undefined, opts);
                }
                const meta = [item.className, dueStr, item.priority].filter(Boolean).join(' · ');
                return `<div class="assign-item">
                    <div class="a-title">${escapeHtml(item.name || item.title || 'Assignment')}</div>
                    <div class="a-meta">${escapeHtml(meta)}</div>
                </div>`;
          }

          loadAssignments();
          setInterval(loadAssignments, CONFIG.ASSIGNMENTS_REFRESH_MS);
          setInterval(renderAssignments, CONFIG.ASSIGNMENTS_RERENDER_MS);

          // ============================================================
          // PHOTO SLIDESHOW (Worker /photos -> iCloud Shared Album)
          // ============================================================
          const slides = [document.getElementById('slide-a'), document.getElementById('slide-b')];
          const photoMsg = document.getElementById('photo-msg');
          const photoDate = document.getElementById('photo-date');
          let photos = [];
          let deck = [];
          let activeSlide = 0;
          let failStreak = 0;
          let slideTimer = null;

          function shuffle(arr) {
                const a = arr.slice();
                for (let i = a.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [a[i], a[j]] = [a[j], a[i]];
                }
                return a;
          }

          function showPhotoMsg(text) {
                photoMsg.innerHTML = `<span class="empty-msg">${escapeHtml(text)}</span>`;
                photoMsg.classList.remove('hidden');
          }

          async function loadPhotos() {
                if (!workerConfigured()) { showPhotoMsg('Worker URL not configured yet.'); return; }
                try {
                        const res = await fetch(workerUrl('/photos'));
                        if (!res.ok) throw new Error('photos http ' + res.status);
                        const data = await res.json();
                        const list = data.photos || [];
                        if (!list.length) {
                                  if (!photos.length) showPhotoMsg(data.error ? 'Photo album not set up yet.' : 'No photos in the album yet.');
                                  return;
                        }
                        const firstLoad = photos.length === 0;
                        photos = list;
                        deck = shuffle(photos); // fresh, unexpired URLs
                        failStreak = 0;
                        if (firstLoad) nextPhoto();
                } catch (err) {
                        console.error('Photos load failed', err);
                        if (!photos.length) showPhotoMsg('Unable to load photos.');
                }
          }

          function nextPhoto() {
                clearTimeout(slideTimer);
                if (!photos.length) return;
                if (!deck.length) deck = shuffle(photos);
                const photo = deck.shift();

                const img = new Image();
                img.onload = () => {
                        failStreak = 0;
                        const next = slides[1 - activeSlide];
                        next.querySelector('.bg').style.backgroundImage = `url("${photo.url}")`;
                        next.querySelector('img').src = photo.url;
                        next.classList.add('show');
                        slides[activeSlide].classList.remove('show');
                        activeSlide = 1 - activeSlide;
                        photoMsg.classList.add('hidden');
                        photoDate.textContent = photo.date
                                ? new Date(photo.date).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' })
                                : '';
                        slideTimer = setTimeout(nextPhoto, CONFIG.PHOTO_INTERVAL_MS);
                };
                img.onerror = () => {
                        failStreak++;
                        if (failStreak >= 3) {
                                  // URLs probably expired; grab a fresh list, then continue.
                                  failStreak = 0;
                                  loadPhotos().then(() => { slideTimer = setTimeout(nextPhoto, 2000); });
                        } else {
                                  slideTimer = setTimeout(nextPhoto, 500);
                        }
                };
                img.src = photo.url;
          }

          loadPhotos();
          setInterval(loadPhotos, CONFIG.PHOTOS_REFRESH_MS);

          function escapeHtml(str) {
                return String(str)
                  .replace(/&/g, '&amp;')
                  .replace(/</g, '&lt;')
                  .replace(/>/g, '&gt;')
                  .replace(/"/g, '&quot;');
          }

      })();
    </script>
  </body>
</html>
